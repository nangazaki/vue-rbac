name: Test

on:
  push:
    branches: 
      - main
      - feat-*
    paths-ignore: 
      - 'docs/**'
      - 'playground/**'
      - 'cli/**'
      - '*.md'
  pull_request:
    branches: 
      - main
    paths-ignore: 
     - 'docs/**'
     - 'playground/**'
     - 'cli/**'
     - '*.md'

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]
      fail-fast: false

    defaults:
      run:
        working-directory: lib
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
 
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: lib/pnpm-lock.yaml
 
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
 
      - name: Run tests
        run: pnpm vitest run --reporter=verbose
 
      - name: Type check
        run: pnpm tsc --noEmit
  
